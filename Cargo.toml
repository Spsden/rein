[package]
name = "rein"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "=0.44.0", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tempfile = "3"
cap-std = "=4.0.3"
